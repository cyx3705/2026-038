name: Python checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: b-Code-SolidEdgeMCP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: OneHistory project contract
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ../b-Code/Test-ProjectContract.ps1 -Instantiation
