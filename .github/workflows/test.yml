name: .NET checks
on: [push, pull_request]
jobs:
  test:
    # COM, the STA worker and net8.0-windows all require Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: b-Code-SolidEdgeMCP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build SolidEdgeMcp.sln --nologo
      - run: dotnet test SolidEdgeMcp.sln --nologo --no-build
      - name: OneHistory project contract
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ../b-Code/Test-ProjectContract.ps1 -Instantiation
