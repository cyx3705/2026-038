[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "solid-edge-ai-mcp"
version = "0.1.0"
description = "A Python MCP server for Siemens Solid Edge, with a dedicated COM apartment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.20,<2", "pillow>=10,<13", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
solid-edge-mcp = "solid_edge_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solid_edge_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: uses a licensed Windows Solid Edge installation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
